<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ร้านรองเท้า YAR GUU (ยากู) กดสั่งซื้อรองเท้าออนไลน์ ตรวจสอบประวัติการสั่งซื้อ และเช็คสถานะการจัดส่ง">
<title>YAR GUU website</title>
<meta name="keywords" content="ยากู, YAR GUU, รองเท้ายากู, ร้านรองเท้ายากู, yagoo, สั่งซื้อรองเท้ายากู, เช็คออเดอร์ยากู">
<meta name="google-site-verification" content="cyEV37huB_sFH_svj09elpR97r6scPoB9wGR7mTvHkE" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111113;
    --bg-soft:#18181b;
    --cream:#F4EFE4;
    --cream-dim:#B9B4A8;
    --accent:#E4453B;
    --accent-soft:#E4453B33;
    --radius:18px;
    --ok:#6FD19A;
    --err:#E4453B;
    --font-body:'Inter','Noto Sans Lao','Noto Sans Thai',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--font-body);
    overflow-x:hidden;
    transition:background .5s ease;
  }
  ::selection{ background:var(--accent); color:#111; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    background:rgba(17,17,19,.75);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(244,239,228,.08);
    gap:12px;
  }
  .logo-mark{
    font-family:'Anton',sans-serif; font-size:22px; letter-spacing:1px;
    display:flex; gap:6px; align-items:baseline; flex-shrink:0;
  }
  .logo-mark span:first-child{ color:var(--cream); }
  .logo-mark span:last-child{ color:var(--accent); transition:color .5s ease; }
  .nav-right{ display:flex; align-items:center; gap:10px; }

  .lang-switch{
    display:flex; background:rgba(244,239,228,.08);
    border:1px solid rgba(244,239,228,.14); border-radius:999px; padding:3px; gap:2px;
  }
  .lang-btn{
    border:none; background:transparent; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--cream-dim);
    padding:7px 12px; border-radius:999px; transition:background .25s ease, color .25s ease; white-space:nowrap;
  }
  .lang-btn.active{ background:var(--cream); color:#111; }

  .nav-cta{
    font-family:var(--font-body); font-weight:700; font-size:13px; letter-spacing:.5px;
    color:#111; background:var(--cream); padding:10px 16px; border-radius:999px;
    text-decoration:none; white-space:nowrap; border:none; cursor:pointer;
  }

  .hero{ position:relative; padding:56px 24px 40px; text-align:center; overflow:hidden; }
  .hero-blob{
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:520px; height:520px; background:var(--accent); filter:blur(90px); opacity:.35;
    border-radius:50%; transition:background .5s ease; pointer-events:none;
  }
  .eyebrow{ position:relative; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--cream-dim); font-weight:600; }
  .wordmark{
    position:relative; font-family:'Anton',sans-serif; line-height:.82; text-transform:uppercase;
    font-size:clamp(64px,18vw,150px); margin-top:10px;
  }
  .wordmark .line2{ color:var(--accent); transition:color .5s ease; }
  .hero-sub{ position:relative; max-width:440px; margin:22px auto 0; color:var(--cream-dim); font-size:15px; line-height:1.7; }
  .hero-price{ position:relative; margin-top:14px; font-family:'Anton',sans-serif; font-size:28px; color:var(--accent); transition:color .5s ease; letter-spacing:.5px; }
  .stock-count{ font-size:11px; color:var(--cream-dim); margin-top:4px; }
  .stock-count.low{ color:var(--accent); }
  .hero-actions{ position:relative; display:flex; gap:12px; justify-content:center; margin-top:30px; flex-wrap:wrap; }
  .btn-primary{
    font-family:var(--font-body); font-weight:800; font-size:14px; letter-spacing:.3px;
    background:var(--accent); color:#111; padding:15px 28px; border-radius:999px;
    text-decoration:none; border:none; cursor:pointer; transition:background .5s ease, transform .15s ease;
  }
  .btn-primary:active{ transform:scale(.97); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{
    font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--cream);
    padding:15px 24px; border-radius:999px; border:1px solid rgba(244,239,228,.25);
    text-decoration:none; background:transparent; cursor:pointer;
  }
  .btn-ghost.small{ padding:9px 16px; font-size:13px; }

  .hero-photo{
    position:relative;
    width:min(320px,80vw);
    margin:34px auto 0;
    aspect-ratio:16/9;
    border-radius:24px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .hero-photo img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .4s ease;
  }
  .hero-photo img.show{ opacity:1; }

  .picker{ position:relative; margin:30px auto 0; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:0 12px; }
  .swatch{
    width:40px; height:40px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .18s ease, border-color .2s ease;
    position:relative;
  }
  .swatch:hover{ transform:translateY(-4px); }
  .swatch.active{ border-color:var(--cream); }
  .swatch::after{ content:''; width:14px; height:14px; border-radius:50%; background:#fff; opacity:0; transition:opacity .2s ease; }
  .swatch.active::after{ opacity:1; }
  .swatch.out{ opacity:.3; cursor:not-allowed; }
  .picker-label{ width:100%; text-align:center; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--cream-dim); margin-bottom:14px; }

  .section{ padding:80px 24px; }
  .section-head{ text-align:center; margin-bottom:44px; }
  .section-head .kicker{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:700; transition:color .5s ease; }
  .section-head h2{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:clamp(28px,6vw,48px); margin-top:8px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; max-width:920px; margin:0 auto; }
  .card{
    position:relative; background:var(--bg-soft); border-radius:var(--radius); padding:22px 16px 18px;
    text-align:center; border:1px solid rgba(244,239,228,.07); cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
  }
  .card:hover{ transform:translateY(-3px); }
  .card.active{ border-color:var(--swatch-color,var(--accent)); }
  .card.out{ opacity:.45; cursor:not-allowed; }
  .card.out:hover{ transform:none; }
  .card .chip{
    width:96px; height:96px; border-radius:14px; margin:0 auto 14px;
    background:var(--swatch-color,#888);
    background-size:cover; background-position:center;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .card .name{ font-weight:800; font-size:14px; letter-spacing:.3px; }
  .card .sub{ font-size:12px; color:var(--cream-dim); margin-top:2px; }
  .card .out-badge{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:800;
    background:var(--err); color:#111; padding:3px 8px; border-radius:999px; letter-spacing:.5px;
  }

  .size-table{ max-width:520px; margin:0 auto; border-collapse:collapse; width:100%; overflow:hidden; border-radius:var(--radius); }
  .size-table th, .size-table td{ padding:14px 10px; text-align:center; font-size:14px; }
  .size-table thead th{ background:var(--accent); color:#111; font-weight:800; text-transform:uppercase; letter-spacing:.5px; font-size:12px; transition:background .5s ease; }
  .size-table tbody tr{ background:var(--bg-soft); }
  .size-table tbody tr:nth-child(even){ background:#151517; }
  .size-note{ max-width:520px; margin:16px auto 0; text-align:center; font-size:13px; color:var(--cream-dim); line-height:1.6; }

  .steps{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:0; }
  .step{ display:flex; gap:18px; align-items:flex-start; padding:22px 0; border-bottom:1px solid rgba(244,239,228,.08); }
  .step:last-child{ border-bottom:none; }
  .step-num{ font-family:'Anton',sans-serif; font-size:26px; color:var(--accent); min-width:38px; transition:color .5s ease; }
  .step-body h3{ font-size:16px; margin-bottom:4px; }
  .step-body p{ font-size:14px; color:var(--cream-dim); line-height:1.5; }

  .cta-band{
    background:var(--bg-soft); border-radius:24px; padding:52px 24px; text-align:center;
    max-width:920px; margin:0 auto 40px; border:1px solid rgba(244,239,228,.07);
  }
  .cta-band h2{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:clamp(26px,6vw,42px); margin-bottom:12px; }
  .cta-band p{ color:var(--cream-dim); font-size:14px; margin-bottom:26px; }

  /* ORDER FORM */
  .order-form{
    max-width:520px; margin:0 auto; background:var(--bg-soft); border-radius:var(--radius);
    padding:28px 22px; border:1px solid rgba(244,239,228,.07);
  }
  .field{ margin-bottom:16px; text-align:left; }
  .field label{ display:block; font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--cream-dim); margin-bottom:7px; }
  .field input, .field select, .field textarea{
    width:100%; background:#0e0e10; border:1px solid rgba(244,239,228,.14); border-radius:12px;
    padding:12px 14px; color:var(--cream); font-family:var(--font-body); font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-msg{ font-size:13px; margin-top:14px; text-align:center; min-height:18px; }
  .form-msg.ok{ color:var(--ok); }
  .form-msg.err{ color:var(--err); }

  /* PAYMENT MODAL */
  .pay-modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .pay-modal-overlay.open{ display:flex; }
  .pay-modal{
    background:#fff; color:#111; border-radius:22px; max-width:340px; width:100%;
    padding:22px 20px 20px; text-align:center; max-height:92vh; overflow-y:auto;
  }
  .pay-modal h3{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:22px; color:#111; margin-bottom:6px; }
  .pay-modal p{ font-size:13px; color:#555; line-height:1.6; margin-bottom:16px; }
  .pay-modal img{ width:100%; display:block; border-radius:14px; margin-bottom:16px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .pay-modal .btn-primary{ width:100%; }

  /* ADMIN */
  #admin{ display:none; background:var(--bg-soft); border-top:1px dashed rgba(244,239,228,.15); }
  #admin.open{ display:block; }
  .admin-box{ max-width:640px; margin:0 auto; }
  .admin-login{ max-width:340px; margin:0 auto; text-align:center; }
  .admin-tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:28px; }
  .admin-tab-btn{
    border:1px solid rgba(244,239,228,.18); background:transparent; color:var(--cream-dim);
    padding:9px 18px; border-radius:999px; font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer;
  }
  .admin-tab-btn.active{ background:var(--cream); color:#111; border-color:var(--cream); }
  .admin-panel{ display:none; }
  .admin-panel.active{ display:block; }
  .stock-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 14px; background:#0e0e10; border-radius:12px; margin-bottom:10px;
  }
  .stock-row .left{ display:flex; align-items:center; gap:10px; }
  .stock-dot{ width:20px; height:20px; border-radius:6px; flex-shrink:0; }
  .toggle{
    position:relative; width:46px; height:26px; border-radius:999px; background:#333; cursor:pointer; flex-shrink:0; border:none;
  }
  .toggle::after{
    content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:var(--cream); transition:transform .2s ease;
  }
  .toggle.on{ background:var(--ok); }
  .toggle.on::after{ transform:translateX(20px); }
  .stock-qty-input{
    width:70px; text-align:center; background:#1a1a1d; color:var(--cream);
    border:1px solid rgba(244,239,228,.16); border-radius:8px; padding:7px 6px; font-size:14px; font-family:var(--font-body);
  }
  .stock-qty-input:focus{ border-color:var(--accent); outline:none; }
  .order-card{ background:#0e0e10; border-radius:14px; padding:16px 16px; margin-bottom:12px; }
  .order-card .row1{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .order-card .oname{ font-weight:800; font-size:15px; }
  .order-card .ots{ font-size:11px; color:var(--cream-dim); white-space:nowrap; }
  .order-card .odetail{ font-size:13px; color:var(--cream-dim); margin-top:6px; line-height:1.6; }
  .order-card .onote{ font-size:13px; margin-top:6px; font-style:italic; color:var(--cream-dim); }
  .order-card .orow2{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .order-card select{
    background:#1a1a1d; color:var(--cream); border:1px solid rgba(244,239,228,.14); border-radius:8px;
    padding:6px 10px; font-size:12px; font-family:var(--font-body);
  }
  .del-btn{ background:none; border:none; color:var(--err); font-size:12px; font-weight:700; cursor:pointer; }
  .wa-link{ color:var(--accent); text-decoration:none; font-weight:700; }
  .empty-note{ text-align:center; color:var(--cream-dim); font-size:14px; padding:20px 0; }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
  .admin-error{ color:var(--err); font-size:13px; margin-top:10px; min-height:16px; }

  .footer-links{ display:flex; justify-content:center; gap:16px; margin-top:8px; }
  .footer-links a{ color:var(--cream-dim); text-decoration:underline; font-size:11px; cursor:pointer; background:none; border:none; font-family:var(--font-body); }
  footer{ text-align:center; padding:30px 24px 40px; font-size:12px; color:var(--cream-dim); letter-spacing:.3px; }

  @media(max-width:520px){
    .hero{ padding-top:40px; }
    .section{ padding:60px 20px; }
    .logo-mark{ font-size:19px; }
    .lang-btn{ padding:7px 9px; font-size:11px; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="hero-blob" id="blob"></div>

<nav>
  <div class="logo-mark"><span>YAR</span><span>GUU</span></div>
  <div class="nav-right">
    <div class="lang-switch" id="langSwitch"></div>
    <a href="#order" class="nav-cta" data-i18n="nav_cta">Order</a>
  </div>
</nav>

<section class="hero">
  <div class="eyebrow">Slide Sandals · EU 37–44</div>
  <h1 class="wordmark">YAR<br><span class="line2">GUU</span></h1>
  <p class="hero-sub" data-i18n="hero_sub"></p>
  <div class="hero-price" id="heroPrice"></div>
  <div class="hero-photo" id="heroPhoto"></div>
  <div class="hero-actions">
    <a href="#order" class="btn-primary" data-i18n="hero_btn_order"></a>
    <a href="#colors" class="btn-ghost" data-i18n="hero_btn_colors"></a>
  </div>
  <div class="picker" id="colors">
    <div class="picker-label" data-i18n="picker_label"></div>
  </div>
</section>

<section class="section">
  <div class="section-head">
    <div class="kicker">Colorway</div>
    <h2 data-i18n="colors_h2"></h2>
  </div>
  <div class="grid" id="productGrid"></div>
</section>

<section class="section" style="background:var(--bg-soft);">
  <div class="section-head">
    <div class="kicker">Size Guide</div>
    <h2 data-i18n="size_h2"></h2>
  </div>
  <table class="size-table">
    <thead>
      <tr>
        <th data-i18n="size_col_eu">EU</th>
        <th data-i18n="size_col_cm">CM</th>
        <th data-i18n="size_col_fit"></th>
      </tr>
    </thead>
    <tbody id="sizeTableBody"></tbody>
  </table>
  <p class="size-note" data-i18n="size_note"></p>
</section>

<section class="section">
  <div class="section-head">
    <div class="kicker">How To</div>
    <h2 data-i18n="howto_h2"></h2>
  </div>
  <div class="steps" id="stepsList"></div>
</section>

<section class="section" id="order" style="background:var(--bg-soft);">
  <div class="cta-band">
    <h2 data-i18n="cta_h2"></h2>
    <p data-i18n="cta_p"></p>
    <div class="hero-actions">
      <a href="https://wa.me/8562059517736" target="_blank" rel="noopener" class="btn-primary" data-i18n="cta_line"></a>
    </div>
  </div>

  <div class="order-form">
    <div class="section-head" style="margin-bottom:22px;">
      <h2 style="font-size:22px;" data-i18n="order_h2"></h2>
    </div>
    <div class="field">
      <label data-i18n="order_name"></label>
      <input type="text" id="fName" required>
    </div>
    <div class="field">
  <label data-i18n="order_phone">เบอร์โทรศัพท์</label>
  <div style="display: flex; align-items: center; background: #0e0e10; border: 1px solid rgba(244,239,228,.14); border-radius: 12px; overflow: hidden;">
    <!-- แถบรหัสประเทศลาว +856 20 -->
    <span style="padding: 12px 0 12px 14px; color: var(--cream-dim); font-size: 14px; font-weight: bold; white-space: nowrap; user-select: none;">+856 20</span>
    
    <!-- ช่องกรอกเบอร์: ล็อคตัวเลข 0-9 เท่านั้น + สูงสุด 8 หลัก -->
    <input type="tel" id="fPhone" required inputmode="numeric" maxlength="8" placeholder="XXXXXXXX" 
           onkeydown="return ['Backspace','Delete','Tab','Escape','Enter','ArrowLeft','ArrowRight'].includes(event.key) || (event.key >= '0' && event.key <= '9')"
           oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8)"
           style="border: none; background: transparent; padding-left: 8px; width: 100%; color: var(--cream); font-family: var(--font-body); font-size: 14px; outline: none;">
  </div>
</div>
    <div class="field-row">
      <div class="field">
        <label data-i18n="order_color"></label>
        <select id="fColor"></select>
      </div>
      <div class="field">
        <label data-i18n="order_size"></label>
        <select id="fSize"></select>
      </div>
    </div>
    <div class="field">
      <label data-i18n="order_qty"></label>
      <input type="number" id="fQty" min="1" value="1">
    </div>
    <!-- แถวที่ 1: ขนส่ง + แขวง -->
    <div class="field-row">
      <div class="field">
        <label>ຂົນສົ່ງ (ขนส่ง)</label>
        <select id="fExpress">
          <option value="Anousith Express">Anousith Express (ອານຸສິດ)</option>
          <option value="Houng Aloun Express">Houng Aloun Express (ຮຸ່ງອາລຸນ)</option>
        </select>
      </div>
      <div class="field">
        <label>ແຂວງ (แขวง)</label>
        <select id="fProvince" onchange="updateDistricts()">
          <option value="">-- ເລືອກແຂວງ --</option>
          <option value="นครหลวงเวียงจันทน์">นครหลวงเวียงจันทน์</option>
          <option value="ผ้งสาลี">ผ้งสาลี (Phongsaly)</option>
          <option value="หลวงน้ำทา">หลวงน้ำทา (Luang Namtha)</option>
          <option value="อุดมไซ">อุดมไซ (Oudomxay)</option>
          <option value="บ่อแก้ว">บ่อแก้ว (Bokeo)</option>
          <option value="หลวงพระบาง">หลวงพระบาง (Luang Prabang)</option>
          <option value="หัวพัน">หัวพัน (Huaphanh)</option>
          <option value="ไชยบุรี">ไชยบุรี (Xayaboury)</option>
          <option value="เชียงขวาง">เชียงขวาง (Xieng Khouang)</option>

<script>
  // If this page is opened outside a Claude.ai artifact preview (e.g. hosted
  // as a normal website), window.storage does not exist. This fallback makes
  // orders/stock still save, using the visitor's own browser (localStorage)
  // instead of Claude's shared artifact storage.
  if(!window.storage){
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(key);
        if(raw === null) throw new Error('not found');
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted: true };
      },
      async list(prefix){
        const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
        return { keys };
      }
    };

  function showHeroPhoto(name){

  function setAccent(hex){
  // แปลง HEX เป็น RGB เพื่อคำนวณความสว่าง
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  
  const r = parseInt(c.substring(0, 2), 16) || 0;
  const g = parseInt(c.substring(2, 4), 16) || 0;
  const b = parseInt(c.substring(4, 6), 16) || 0;
  
  // สูตรคำนวณความสว่าง (Brightness)
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;

  // ถ้าความสว่างต่ำกว่า 100 (แสดงว่าสีเข้ม/มืด เช่น สีดำ สีเทาเข้ม) ให้บังคับใช้สีขาวสว่างแทน
  const safeColor = brightness < 100 ? '#F4EFE4' : hex;

  root.style.setProperty('--accent', safeColor);
  root.style.setProperty('--cream', safeColor);
  
  if (typeof blob !== 'undefined' && blob) {
    blob.style.background = hex;
  }
}

  // ---------- language switch ----------

  function setLang(code){
    currentLang = code;
    root.setAttribute('lang', htmlLangMap[code]);
    document.querySelectorAll('.lang-btn').forEach((b,i) => {
      b.classList.toggle('active', Object.keys(langNames)[i] === code);
    });
    const t = i18n[code];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(t[key] !== undefined) el.textContent = t[key];
    });

    stepsList.innerHTML = '';

      const step = document.createElement('div');
      step.className = 'step';

      stepsList.appendChild(step);

    document.querySelectorAll('.card .name').forEach((el, i) => {

    sw.addEventListener('click', () => {
      if(!(stockState[c.name] > 0)) return;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      document.querySelectorAll('.card').forEach(cd=>cd.classList.remove('active'));
      cards[i].classList.add('active');
      setAccent(c.hex);
      showHeroPhoto(c.name);
    });
    picker.appendChild(sw);

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = c.name;
    card.style.setProperty('--swatch-color', c.hex);
    card.innerHTML = `<div class="chip" style="background-image:url('${c.img}')"></div><div class="name"></div><div class="sub">YAR GUU · ${c.name}</div><div class="stock-count"></div>`;
    card.addEventListener('click', () => {
      if(!(stockState[c.name] > 0)) return;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      document.querySelectorAll('.card').forEach(cd=>cd.classList.remove('active'));
      card.classList.add('active');
      document.querySelectorAll('.swatch')[i].classList.add('active');
      setAccent(c.hex);
      showHeroPhoto(c.name);
    });
    grid.appendChild(card);
  });
  const cards = document.querySelectorAll('.card');
  const swatchEls = document.querySelectorAll('.swatch');

  function applyStockToUI(){
    const t = i18n[currentLang];
    colors.forEach((c, i) => {
      const qty = stockState[c.name] || 0;
      const inStock = qty > 0;
      cards[i].classList.toggle('out', !inStock);
      swatchEls[i].classList.toggle('out', !inStock);
      let badge = cards[i].querySelector('.out-badge');
      if(!inStock){
        if(!badge){
          badge = document.createElement('div');
          badge.className = 'out-badge';
          cards[i].appendChild(badge);
        }
        badge.textContent = t.out_of_stock;
      } else if(badge){
        badge.remove();
      }
      const countEl = cards[i].querySelector('.stock-count');
      if(countEl){
        if(inStock){
          countEl.textContent = t.stock_left.replace('{n}', qty);
          countEl.classList.toggle('low', qty <= 5);
        } else {
          countEl.textContent = '';
        }
      }
    });
    renderColorSelect();
  }

  function defaultInStockIndex(){
    const idx = colors.findIndex(c => (stockState[c.name] || 0) > 0);
    return idx === -1 ? 0 : idx;
  }

      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = t.colorNames[c.name];

  // ---------- order form ----------
  const fMsg = document.getElementById('fMsg');
  document.getElementById('fSubmit').addEventListener('click', async () => {
    const t = i18n[currentLang];
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    const color = document.querySelector('.color-option.active')?.dataset.name || '-';
    const size = document.querySelector('.size-option.active')?.dataset.size || '-';
    let qty = parseInt(document.getElementById('fQty')?.value, 10);
    if(!Number.isFinite(qty) || qty < 1) qty = 1;
    const village = document.getElementById('fVillage').value.trim();
    const district = document.getElementById('fDistrict').value.trim();
    const province = document.getElementById('fProvince').value.trim();
    const note = document.getElementById('fNote').value.trim();

    if(!name || !phone || !color || !size){
      fMsg.textContent = t.order_err;
      fMsg.className = 'form-msg err';
      return;
    }

    const order = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      ts: new Date().toISOString(),
      name, phone, color, size, qty, village, district, province, note,
      status: 'new',
    };

    try{
      const freshStock = await loadStock();
      if(freshStock) stockState = Object.assign(stockState, freshStock);
      const available = stockState[color] || 0;
      if(qty > available){
        fMsg.textContent = t.order_stock_err.replace('{n}', available);
        fMsg.className = 'form-msg err';
        applyStockToUI();
        return;
      }

      const existing = await loadOrders();
      if(BACKEND_URL){
        const res = await backendCall('addOrder', { order });
        if(!res || !res.ok) throw new Error('save failed');
      } else {
        existing.unshift(order);
        const res = await window.storage.set(ORDERS_KEY, JSON.stringify(existing), true);
        if(!res) throw new Error('save failed');
      }

      stockState[color] = available - qty;
      if(BACKEND_URL){
        await backendCall('setStock', { stock: stockState });
      } else {
        try{ await window.storage.set(STOCK_KEY, JSON.stringify(stockState), true); }catch(e){}
      }
      applyStockToUI();

      fMsg.textContent = t.order_ok + ' (#' + order.id + ')';
      fMsg.className = 'form-msg ok';
      payModalOverlay.classList.add('open');
      document.getElementById('fName').value = '';
      document.getElementById('fPhone').value = '';
      document.getElementById('fQty').value = 1;
      document.getElementById('fVillage').value = '';
      document.getElementById('fDistrict').value = '';
      document.getElementById('fProvince').value = '';
      document.getElementById('fNote').value = '';
    }catch(e){
      fMsg.textContent = t.order_err;
      fMsg.className = 'form-msg err';
    }
  });

  // ---------- storage helpers ----------

      if(r && r.value) return JSON.parse(r.value);
    }catch(e){}
    return null;
  }
  async function loadOrders(){
    if(BACKEND_URL){
      const data = await backendCall('getOrders');
      return Array.isArray(data) ? data : [];
    }
    try{
      const r = await window.storage.get(ORDERS_KEY, true);
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){}

          <div class="stock-dot" style="background:${c.hex}"></div>
          <span>${t.colorNames[c.name]}</span>
        </div>
        <input type="number" class="stock-qty-input" min="0" step="1" value="${qty}" data-color="${c.name}" aria-label="Stock quantity for ${c.name}">
      `;
      stockList.appendChild(row);
    });
    stockList.querySelectorAll('.stock-qty-input').forEach(inp => {
      inp.addEventListener('change', async () => {
        const name = inp.dataset.color;
        let val = parseInt(inp.value, 10);
        if(!Number.isFinite(val) || val < 0) val = 0;
        inp.value = val;
        stockState[name] = val;
        applyStockToUI();
        if(BACKEND_URL){
          await backendCall('setStock', { stock: stockState });
        } else {
          try{ await window.storage.set(STOCK_KEY, JSON.stringify(stockState), true); }catch(e){}
        }
      });
    });
  }

  const ordersList = document.getElementById('ordersList');
  function renderOrders(){
    if(!isAdmin) return;
    const t = i18n[currentLang];
    ordersList.innerHTML = '';
    if(ordersCache.length === 0){
      ordersList.innerHTML = `<div class="empty-note">${t.admin_orders_empty}</div>`;
      return;
    }
    ordersCache.forEach(o => {
      const d = new Date(o.ts);
      const dateStr = isNaN(d) ? '' : d.toLocaleString();
      const colorLabel = t.colorNames[o.color] || o.color;
      const waDigits = (o.phone || '').replace(/[^0-9]/g,'');
      const addrParts = [o.village, o.district, o.province].filter(Boolean).map(escapeHtml);
      const addrLine = addrParts.length ? `<br>${addrParts.join(', ')}` : '';
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = `
        <div class="row1">
          <div class="oname">${escapeHtml(o.name)}</div>
          <div class="ots">${dateStr}</div>
        </div>
        <div class="odetail">
          ${colorLabel} · EU ${escapeHtml(String(o.size))} · x${escapeHtml(String(o.qty))}<br>
          <a class="wa-link" href="https://wa.me/${waDigits}" target="_blank" rel="noopener">${escapeHtml(o.phone)}</a>${addrLine}
        </div>
        ${o.note ? `<div class="onote">"${escapeHtml(o.note)}"</div>` : ''}
        <div class="orow2">
          <select data-id="${o.id}" class="status-select">
            <option value="new" ${o.status==='new'?'selected':''}>${t.status_new}</option>
            <option value="contacted" ${o.status==='contacted'?'selected':''}>${t.status_contacted}</option>
            <option value="done" ${o.status==='done'?'selected':''}>${t.status_done}</option>
          </select>
          <button class="del-btn" data-id="${o.id}" aria-label="Delete order">✕</button>
        </div>
      `;
      ordersList.appendChild(card);
    });

    ordersList.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.dataset.id;
        const ord = ordersCache.find(o => o.id === id);
        if(ord){
          ord.status = sel.value;
          if(BACKEND_URL){ await backendCall('updateOrderStatus', { id, status: sel.value }); }
          else { await saveOrders(); }
        }
      });
    });
    ordersList.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        ordersCache = ordersCache.filter(o => o.id !== id);
        if(BACKEND_URL){ await backendCall('deleteOrder', { id }); }
        else { await saveOrders(); }
        renderOrders();
      });
    });
  }

  async function saveOrders(){
    try{ await window.storage.set(ORDERS_KEY, JSON.stringify(ordersCache), true); }catch(e){}
  }
  async function refreshOrders(){
    ordersCache = await loadOrders();
    renderOrders();
  }
  document.getElementById('ordersRefresh').addEventListener('click', refreshOrders);

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- init ----------
  (async function init(){
    const storedStock = await loadStock();
    if(storedStock) stockState = Object.assign(stockState, storedStock);
    applyStockToUI();

    const defIdx = defaultInStockIndex();
    swatchEls[defIdx].classList.add('active');
    cards[defIdx].classList.add('active');
    setAccent(colors[defIdx].hex);
    showHeroPhoto(colors[defIdx].name);

    setLang('lo');
  })();
</script>

<script>

  const QR_CODE_IMAGE_URL = 'https://i.ibb.co/gMPv9Zjy/9134c124-3760-4a40-a051-90d41e63b892.jpg';

  const modalHTML = `

        ${QR_CODE_IMAGE_URL ? `<img src="${QR_CODE_IMAGE_URL}" alt="QR Code" style="max-width:230px; width:100%; border-radius:12px; border:1px solid #444; padding:6px; background:#fff; margin-bottom:15px;" />` : ''}

  // ฟังก์ชันแสดงข้อความสีแดงใต้ปุ่มสั่งซื้อ
  function showFormError(msg, targetElem) {
    let errBox = document.getElementById('formErrorMsg');
    
    // ถ้ายังไม่มีกล่องข้อความ ให้สร้างกล่องสีแดงใต้ปุ่มส่งข้อมูลให้อัตโนมัติ
    if (!errBox) {
      errBox = document.createElement('div');
      errBox.id = 'formErrorMsg';
      errBox.style.cssText = 'color: #ff4d4f; font-size: 13px; margin-top: 10px; text-align: center; font-weight: bold; transition: all 0.3s ease;';
      if (targetElem && targetElem.parentNode) {
        targetElem.parentNode.insertBefore(errBox, targetElem.nextSibling);
      }
    }
    
    errBox.textContent = msg;
    if (targetElem && typeof targetElem.focus === 'function') {
      targetElem.focus();
    }
  }

  // ล้างข้อความสีแดงออก
  function clearFormError() {
    const errBox = document.getElementById('formErrorMsg');
    if (errBox) errBox.textContent = '';
  }

  function processAndCompressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIZE = 800;

          if (width > height && width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          } else if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            width = MAX_SIZE;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = (err) => reject(err);
      };
      reader.onerror = (err) => reject(err);
    });
  }

  document.addEventListener('click', function(e) {
    const target = e.target;
    
    const isSubmitButton = target && (
      target.id === 'fSubmit' || 
      (target.tagName === 'BUTTON' && (target.innerText.trim() === 'ฝากคำสั่งซื้อ' || target.innerText.trim() === 'ຝາກຄຳສັ່ງຊື້')) ||
      (target.tagName === 'INPUT' && target.type === 'submit')
    );

    if (isSubmitButton) {
      e.preventDefault();
      e.stopPropagation();

      const phoneInput = document.getElementById('fPhone');
      const provinceSelect = document.getElementById('fProvince');
      const districtSelect = document.getElementById('fDistrict');
      const branchInput = document.getElementById('fBranch');

      // 1. ตรวจสอบเบอร์โทรศัพท์
      if (phoneInput && !phoneInput.value.trim()) {
        showFormError("กรุณากรอกเบอร์โทรศัพท์ / เบอร์ WhatsApp ก่อนสั่งซื้อ!", target);
        phoneInput.focus();
        return;
      }

      // 2. ตรวจสอบแขวง
      if (provinceSelect && (!provinceSelect.value || provinceSelect.value.includes('--') || provinceSelect.value.trim() === '')) {
        showFormError("กรุณาเลือกแขวง (ເລືອກແຂວງ) ก่อนสั่งซื้อ!", target);
        provinceSelect.focus();
        return;
      }

      // 3. ตรวจสอบเมือง
      if (districtSelect && (!districtSelect.value || districtSelect.value.includes('--') || districtSelect.value.trim() === '')) {
        showFormError("กรุณาเลือกเมือง (ເລືອກເມືອງ) ก่อนสั่งซื้อ!", target);
        districtSelect.focus();
        return;
      }

      // 4. ตรวจสอบสาขาขนส่ง
      if (branchInput && !branchInput.value.trim()) {
        showFormError("กรุณาระบุสาขาขนส่ง (ສາຂາ) ก่อนสั่งซื้อ!", target);
        branchInput.focus();
        return;
      }

      // ถ้ากรอกครบแล้ว ล้างข้อความเตือนสีแดง และเปิด QR Code
      clearFormError();
      document.getElementById('modalStatusMsg').textContent = '';
      document.getElementById('appQrModal').style.display = 'flex';
    }
  });

  document.getElementById('btnModalCancel').addEventListener('click', function() {
    document.getElementById('appQrModal').style.display = 'none';
  });

  document.getElementById('btnModalConfirm').addEventListener('click', async function() {
    const statusMsg = document.getElementById('modalStatusMsg');
    const slipFileInput = document.getElementById('modalSlipInput');
    let slipBase64 = '';

    if (slipFileInput && slipFileInput.files && slipFileInput.files[0]) {
      try {
        statusMsg.style.color = '#4dabf7';
        statusMsg.textContent = 'กำลังประมวลผลรูปสลิป...';
        slipBase64 = await processAndCompressImage(slipFileInput.files[0]);
      } catch (err) {
        console.error(err);
      }
    }

    const rawPhone = document.getElementById('fPhone') ? document.getElementById('fPhone').value.trim() : '';
    const cleanPhone = "+856 20 " + rawPhone;

    const payloadData = {
      name: document.getElementById('fName') ? document.getElementById('fName').value.trim() : '',
      phone: cleanPhone,
      express: document.getElementById('fExpress') ? document.getElementById('fExpress').value : '',
      province: document.getElementById('fProvince') ? document.getElementById('fProvince').value.trim() : '',
      district: document.getElementById('fDistrict') ? document.getElementById('fDistrict').value.trim() : '',
      branch: document.getElementById('fBranch') ? document.getElementById('fBranch').value.trim() : '',
      color: document.getElementById('fColor') ? document.getElementById('fColor').value : '',
      size: document.getElementById('fSize') ? document.getElementById('fSize').value : '',
      qty: document.getElementById('fQty') ? document.getElementById('fQty').value : '1',
      note: document.getElementById('fNote') ? document.getElementById('fNote').value.trim() : '',
      slip: slipBase64
    };

    statusMsg.style.color = '#4dabf7';
    statusMsg.textContent = 'กำลังส่งข้อมูล...';

    fetch(GOOGLE_SCRIPT_URI, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payloadData)
    })
    .then(res => res.json())
    .then(data => {
      statusMsg.style.color = '#51cf66';
      statusMsg.textContent = 'สั่งซื้อและส่งข้อมูลสำเร็จแล้ว!';
      setTimeout(() => {
        document.getElementById('appQrModal').style.display = 'none';
      }, 1200);
    })
    .catch(err => {
      statusMsg.style.color = '#51cf66';
      statusMsg.textContent = 'สั่งซื้อและส่งข้อมูลสำเร็จแล้ว!';
      setTimeout(() => {
        document.getElementById('appQrModal').style.display = 'none';
      }, 1200);
    });
  });
</script>
<script>
  // ==========================================
  // 1. ส่วนดักจับการกดสั่งซื้อ (หน้าบ้าน)
  // ==========================================
  const orderForm = document.getElementById('orderForm') || document.querySelector('form');
  if (orderForm) {
    orderForm.addEventListener('submit', function(e) {
      e.preventDefault();

      // ดึงค่าเบอร์โทรศัพท์ (รวม +856 20 ข้างหน้า)
      const phoneInput = document.getElementById('fPhone') ? document.getElementById('fPhone').value : '';

      const slipInput = document.getElementById('fSlip') || document.querySelector('input[type="file"]');
      const file = slipInput && slipInput.files ? slipInput.files[0] : null;

      const saveAndRender = (slipBase64) => {
        const newOrder = {
          id: Date.now(),
          date: new Date().toLocaleString(),
          name: document.getElementById('fName')?.value || '',
          phone: fullPhone,
          whatsapp: document.getElementById('fWhatsapp')?.value || '',

        let orders = JSON.parse(localStorage.getItem('yar_orders') || '[]');
        orders.push(newOrder);
        localStorage.setItem('yar_orders', JSON.stringify(orders));

        alert('ส่งคำสั่งซื้อเรียบร้อยแล้ว!');
        renderAdminOrders();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveAndRender(event.target.result);
        };
        reader.readAsDataURL(file);
      } else {
        saveAndRender('');
      }

  // ==========================================
  // 2. ส่วนดึงข้อมูลมาแสดงผลในหลังบ้าน (รายการสั่งซื้อ)
  // ==========================================
  function renderAdminOrders() {
    // ดึงกล่องแสดงผลหลังบ้านที่มีข้อความ "ยังไม่มีคำสั่งซื้อ"

    if (orders.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#888;">ยังไม่มีคำสั่งซื้อ</p>';
      return;
    }

    let html = '<div style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:800px; margin:20px auto;">';
    
    orders.forEach((order, index) => {
      html += `
        <div style="background:#18181c; border:1px solid rgba(255,255,255,0.1); padding:16px; border-radius:12px; color:#fff; text-align:left;">

          <p style="margin:4px 0;"><strong>ขนส่ง:</strong> ${order.express}</p>
          <p style="margin:4px 0;"><strong>แขวง/เมือง:</strong> ${order.province} / ${order.district}</p>
          ${order.slip ? `
            <div style="margin-top:10px;">
              <strong>สลิปโอนเงิน:</strong><br>
              <img src="${order.slip}" style="max-width:150px; border-radius:8px; margin-top:6px; cursor:pointer;" onclick="window.open('${order.slip}')">
            </div>
          ` : ''}
        </div>
      `;
    });

    html += '</div>';
    container.innerHTML = html;
  }

  function deleteOrder(id) {
    if (confirm('คุณต้องการลบรายการสั่งซื้อนี้ใช่หรือไม่?')) {
      let orders = JSON.parse(localStorage.getItem('yar_orders') || '[]');
      orders = orders.filter(o => o.id !== id);
      localStorage.setItem('yar_orders', JSON.stringify(orders));
      renderAdminOrders();
    }
  }

  // โหลดข้อมูลแสดงผลทันทีเมื่อเปิดหน้า
  document.addEventListener('DOMContentLoaded', renderAdminOrders);
</script>
<script>
  // ปรับตำแหน่งให้พ้นกลุ่มเปลี่ยนภาษา + ดีไซน์ให้เหมือนปุ่มหลักของเว็บ
  const checkInModalHTML = `
    <div id="checkInBtnBox" style="position:fixed; top:20px; right:320px; z-index:999;">
      <button id="btnOpenCheckIn" style="background:#181818; color:#ffffff; border:1px solid #333333; padding:7px 16px; border-radius:20px; cursor:pointer; font-size:13px; font-family:inherit; font-weight:500; display:flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(0,0,0,0.3); transition:all 0.2s ease;">
        <span style="font-size:14px;">📦</span> Check Order
      </button>
    </div>

    <div id="checkInModal" style="display:none; position:fixed; z-index:999999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
      <div style="background:#1e1e1e; color:#fff; padding:24px; border-radius:16px; width:90%; max-width:400px; text-align:center; border:1px solid #333; font-family:inherit;">
        <h3 style="margin-top:0; font-size:18px;">เช็คอิน / ค้นหาประวัติสั่งซื้อ</h3>
        <p style="font-size:12px; color:#aaa; margin-bottom:15px;">กรอกเบอร์โทรศัพท์ที่เคยใช้สั่งซื้อเพื่อดูประวัติ</p>
        
        <input type="tel" id="checkInPhone" placeholder="กรอกเบอร์โทรศัพท์ (เช่น 20xxxxxxxx)" style="width:90%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #444; background:#2a2a2a; color:#fff; text-align:center; font-size:14px; outline:none;">
        
        <button id="btnSearchHistory" style="width:95%; padding:10px; background:#fff; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:15px;">ตรวจสอบประวัติ</button>

        <div id="checkInResult" style="text-align:left; max-height:250px; overflow-y:auto; font-size:13px; border-top:1px solid #333; padding-top:10px;"></div>

        <button onclick="document.getElementById('checkInModal').style.display='none'" style="margin-top:15px; background:transparent; color:#888; border:none; cursor:pointer; font-size:12px;">ปิดหน้าต่าง</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', checkInModalHTML);

  // เอฟเฟกต์เวลาเอาเมาส์ไปชี้ (Hover)
  const btn = document.getElementById('btnOpenCheckIn');
  btn.onmouseover = () => { 
    btn.style.background = '#282828'; 
    btn.style.borderColor = '#555555';
    btn.style.transform = 'translateY(-1px)';
  };
  btn.onmouseout = () => { 
    btn.style.background = '#181818'; 
    btn.style.borderColor = '#333333';
    btn.style.transform = 'translateY(0)';
  };

  // เปิดป๊อปอัป
  btn.onclick = function() {
    document.getElementById('checkInModal').style.display = 'flex';
  };

  // กดค้นหาประวัติ
  document.getElementById('btnSearchHistory').onclick = function() {
    const phoneInput = document.getElementById('checkInPhone').value.trim();
    const resultBox = document.getElementById('checkInResult');

    if (!phoneInput) {
      resultBox.innerHTML = '<span style="color:#ff6b6b;">กรุณากรอกเบอร์โทรศัพท์</span>';
      return;
    }

    resultBox.innerHTML = '<span style="color:#4dabf7;">กำลังค้นหาข้อมูล...</span>';

    fetch(GOOGLE_SCRIPT_URI, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'getHistory',
        phone: phoneInput
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success' && data.history.length > 0) {
        let html = '';
        data.history.forEach((item, index) => {
          html += `
  <div style="border-bottom:1px solid #333; padding:8px 0;">
    <b>รายการที่ ${index + 1}</b> (${new Date(item.date).toLocaleDateString()})<br>
    คุณ: ${item.name}<br>
    สินค้า: สี ${item.color} / ไซส์ ${item.size} (${item.qty} ชิ้น)<br>
    ขนส่ง: ${item.express}<br>${item.status ? `สถานะ: ${item.status}<br>` : ''}
    ${item.slip ? `<a href="${item.slip}" target="_blank" style="color:#4dabf7;">ดูสลิปโอนเงิน</a>` : ''}
  </div>
`
        });
        resultBox.innerHTML = html;
      } else {
        resultBox.innerHTML = '<span style="color:#aaa;">ไม่พบประวัติการสั่งซื้อสำหรับเบอร์นี้</span>';
      }
    })
    .catch(err => {
      resultBox.innerHTML = '<span style="color:#ff6b6b;">เกิดข้อผิดพลาดในการโหลดข้อมูล</span>';
    });
  };
</script>
<script>
  const STOCK_SCRIPT_URI = 'https://script.google.com/macros/s/AKfycbzTWCvAd-ZYoirYrq-wG8I87C4JnwmOyRhZsErFY6Vj53kX0atU8mCGjdBGB0sRZv7Ycw/exec';

  const colorMap = {
    'ดำ': ['ดำ', 'ດຳ', 'black'],
    'ขาว': ['ขาว', 'ຂາວ', 'white'],
    'แดง': ['แดง', 'ແດງ', 'red'],
    'บัว': ['บัว', 'ບົວ', 'pink'],
    'ม่วง': ['ม่วง', 'ມ່ວງ', 'purple'],
    'มิน': ['มิน', 'ມິນ', 'mint'],
    'ฟ้าเข้ม': ['ฟ้าเข้ม', 'ຟ້າເຂັ້ມ', 'navy', 'blue']
  };

  let globalStockData = {};

  async function fetchRealtimeStock() {
    if (!STOCK_SCRIPT_URI || STOCK_SCRIPT_URI.includes('นำ_URL_GOOGLE_SCRIPT')) return;

    try {
      const response = await fetch(STOCK_SCRIPT_URI + '?t=' + new Date().getTime());
      globalStockData = await response.json();
      
      updateProductCards(globalStockData);
      updateSizeDropdown();
    } catch (error) {
      console.error("เกิดข้อผิดพลาดในการดึงข้อมูลสต็อก:", error);
    }
  }

  // 1. อัปเดตข้อความใต้รูปสินค้า (แสดงจำนวนรวม + รายชื่อไซส์ที่มี)
  function updateProductCards(stockData) {
  const cards = document.querySelectorAll('.colorway-card, [data-color], .card');

  cards.forEach(card => {
    // ดึงข้อความและ data-color จากการ์ด
    const cardColorAttr = card.getAttribute('data-color') || '';
    const cardText = cardColorAttr + ' ' + (card.innerText || '');

    Object.keys(stockData).forEach(sheetColor => {
      const keywords = colorMap[sheetColor] || [sheetColor];
      
      // ตรวจสอบการจับคู่สีดำ (รองรับทั้ง ดำ, ດຳ, Black)
      let isMatched = keywords.some(kw => cardText.toLowerCase().includes(kw.toLowerCase()));
      if (sheetColor.trim() === 'ดำ' && (cardText.includes('ດຳ') || cardText.toLowerCase().includes('black') || cardText.includes('ดำ'))) {
        isMatched = true;
      }

      if (isMatched) {
        const item = stockData[sheetColor];
        const total = item.total;
        
        // คัดเอาเฉพาะไซส์ที่จำนวน > 0 จาก Google Sheets (เรียงลำดับตัวเลขไซส์)
        const availableSizes = [];
        if (item.sizes) {
          Object.keys(item.sizes)
            .sort((a, b) => Number(a) - Number(b))
            .forEach(size => {
              if (Number(item.sizes[size]) > 0) {
                availableSizes.push(size);
              }
            });
        }

        // ค้นหา Element แสดงจำนวนคู่
        const elements = card.querySelectorAll('p, span, div, small');
        elements.forEach(el => {
          if (el.children.length === 0) {
            const txt = el.textContent.trim();
            
            if (txt.includes('เหลือ') || txt.includes('ເຫຼືອ')) {
              // 1. อัปเดตจำนวนคู่ Real-time
              el.textContent = `ເຫຼືອ ${total} ຄູ່`;

              // 2. ตรวจหาหรือสร้างแท็กแสดงไซส์ต่อท้ายใต้อัปเดตจำนวนคู่
              let sizeEl = card.querySelector('.generated-size-info');
              if (!sizeEl) {
                sizeEl = document.createElement('div');
                sizeEl.className = 'generated-size-info';
                sizeEl.style.fontSize = '11px';
                sizeEl.style.color = '#ccc';
                sizeEl.style.marginTop = '4px';
                el.insertAdjacentElement('afterend', sizeEl);
              }

              // แสดงรายการไซส์ที่มีของอยู่จริงตาม Google Sheets
              sizeEl.textContent = availableSizes.length > 0 ? `(ມີໄຊສ໌: ${availableSizes.join(', ')})` : '(ໝົດ)';
            }
          }
        });
      }
    });
  });
}

  // 2. ปรับ Dropdown เลือกไซส์ในหน้าสั่งซื้อ (ไซส์ไหนเป็น 0 จะซ่อนหรือขึ้นว่า หมด)
  function updateSizeDropdown() {
    const colorSelect = document.querySelector('select[name="color"]') || document.querySelectorAll('select')[0];
    const sizeSelect = document.querySelector('select[name="size"]') || document.querySelectorAll('select')[1];

    if (!colorSelect || !sizeSelect) return;

    const selectedColorText = colorSelect.value || colorSelect.options[colorSelect.selectedIndex]?.text || '';
    
    // ค้นหาสีใน Sheet ที่ตรงกับตัวเลือก
    let currentSheetColor = Object.keys(globalStockData).find(sheetColor => {
      const keywords = colorMap[sheetColor] || [sheetColor];
      return keywords.some(kw => selectedColorText.toLowerCase().includes(kw.toLowerCase()));
    });

    if (!currentSheetColor || !globalStockData[currentSheetColor]) return;

    const sizeData = globalStockData[currentSheetColor].sizes;

    // วนลูปเช็กไซส์ใน Dropdown
    Array.from(sizeSelect.options).forEach(opt => {
      const sizeNum = opt.value.replace(/[^0-9]/g, '') || opt.text.replace(/[^0-9]/g, '');
      if (sizeNum && sizeData.hasOwnProperty(sizeNum)) {
        const qty = sizeData[sizeNum];
        if (qty <= 0) {
          opt.disabled = true;
          opt.text = `EU ${sizeNum} (ໝົດ - ไม่มีไซส์นี้)`;
        } else {
          opt.disabled = false;
          opt.text = `EU ${sizeNum}`;
        }
      }
    });
  }

  // ผูก Event ให้เปลี่ยนไซส์ตามสีที่เลือกในฟอร์มสั่งซื้อ
  document.addEventListener("DOMContentLoaded", () => {
    fetchRealtimeStock();
    setInterval(fetchRealtimeStock, 5000);

    const colorSelect = document.querySelector('select[name="color"]') || document.querySelectorAll('select')[0];
    if (colorSelect) {
      colorSelect.addEventListener('change', updateSizeDropdown);
    }
  });
</script>
